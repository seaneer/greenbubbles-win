name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Byte-compile
        run: python -m compileall -q src

      - name: Unit tests
        run: python -m unittest tests.test_units -v

      - name: Full suite (data-dependent tests skip)
        run: python -m unittest discover -s tests -t . -v

  portable:
    name: Portable ZIP on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable ZIP
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-portable.ps1 -PythonExe python

      - name: Smoke test
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*-portable.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath dist\smoke -Force
          $root = Join-Path (Resolve-Path dist\smoke) (Get-ChildItem dist\smoke | Select-Object -First 1).Name
          & "$root\greenbubbles.cmd" --help
          & "$root\python\python.exe" -m unittest tests.test_units

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenbubbles-win-portable
          path: |
            dist/*-portable.zip
            dist/*-portable.zip.sha256
