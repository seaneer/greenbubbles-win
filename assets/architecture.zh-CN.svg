<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" width="960" height="414" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">只读查看你自己的微信聊天记录</title>
  <desc id="desc">GreenBubbles for Windows 在本机读取微信 4.x 的加密数据库，只返回 Agent 请求的会话；无需导出。另一条可选路径生成加密快照，换机后无需微信即可恢复。</desc>
  <rect width="960" height="414" rx="20" fill="#F3F8F4"/>
  <text x="32" y="40" font-size="23" font-weight="700" fill="#12382D">只读查看你自己的微信聊天记录</text>
  <text x="32" y="67" font-size="15" fill="#46645A">无需导出，不维护第二份副本；原地查询原始数据。</text>

  <g stroke="#B8CFC2" stroke-width="2" fill="#FFFFFF">
    <rect x="32" y="126" width="252" height="116" rx="16"/>
    <rect x="363" y="126" width="230" height="116" rx="16" fill="#087F5B" stroke="#087F5B"/>
    <rect x="690" y="126" width="238" height="116" rx="16"/>
    <rect x="363" y="309" width="565" height="77" rx="16"/>
  </g>

  <g text-anchor="middle">
    <text x="158" y="163" font-size="19" font-weight="700" fill="#12382D">微信 4.x</text>
    <text x="158" y="191" font-size="15" fill="#46645A">加密的本地数据</text>
    <text x="158" y="216" font-size="14" fill="#46645A">始终留在本机</text>

    <text x="478" y="164" font-size="22" font-weight="700" fill="#FFFFFF">GreenBubbles</text>
    <text x="478" y="193" font-size="15" fill="#FFFFFF">只读查询层</text>
    <text x="478" y="218" font-size="14" fill="#FFFFFF">命令行 · HTTP · MCP</text>

    <text x="809" y="166" font-size="21" font-weight="700" fill="#12382D">你的 Agent</text>
    <text x="809" y="195" font-size="14" fill="#46645A">搜索、总结、归档</text>
    <text x="809" y="219" font-size="13" fill="#46645A">只获取它请求的内容</text>

    <text x="645" y="339" font-size="18" font-weight="700" fill="#12382D">可选加密快照</text>
    <text x="645" y="365" font-size="14" fill="#46645A">换机后可离线恢复 · 24 词助记词</text>
  </g>

  <g fill="none" stroke="#087F5B" stroke-width="2.5">
    <path d="M290 184h62"/>
    <path d="M599 184h80"/>
    <path d="M478 248v51"/>
  </g>
  <g fill="#087F5B">
    <polygon points="352,184 341,178 341,190"/>
    <polygon points="679,184 668,178 668,190"/>
    <polygon points="478,299 472,288 484,288"/>
  </g>
  <g font-size="13" fill="#46645A">
    <text x="321" y="174" text-anchor="end">读取</text>
    <text x="639" y="174" text-anchor="end">返回</text>
    <text x="496" y="279">可选备份</text>
  </g>
</svg>
