<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" width="960" height="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Read your own WeChat history, locally</title>
  <desc id="desc">GreenBubbles for Windows reads WeChat 4.x encrypted databases on the same PC and returns only the conversations an agent asks for. No export step is required. A separate optional path creates an encrypted snapshot that can be restored without WeChat.</desc>
  <rect width="960" height="414" rx="20" fill="#F3F8F4"/>
  <text x="32" y="40" font-size="23" font-weight="700" fill="#12382D">Read your own WeChat history. Locally.</text>
  <text x="32" y="67" font-size="15" fill="#46645A">No export, no second copy to keep in sync. Query the original data in place.</text>

  <g stroke="#B8CFC2" stroke-width="2" fill="#FFFFFF">
    <rect x="32" y="126" width="252" height="116" rx="16"/>
    <rect x="363" y="126" width="230" height="116" rx="16" fill="#087F5B" stroke="#087F5B"/>
    <rect x="690" y="126" width="238" height="116" rx="16"/>
    <rect x="363" y="309" width="565" height="77" rx="16"/>
  </g>

  <g text-anchor="middle">
    <text x="158" y="163" font-size="19" font-weight="700" fill="#12382D">WeChat 4.x</text>
    <text x="158" y="191" font-size="15" fill="#46645A">Encrypted local data</text>
    <text x="158" y="216" font-size="14" fill="#46645A">Stays on this PC</text>

    <text x="478" y="164" font-size="22" font-weight="700" fill="#FFFFFF">GreenBubbles</text>
    <text x="478" y="193" font-size="15" fill="#FFFFFF">Read-only query layer</text>
    <text x="478" y="218" font-size="14" fill="#FFFFFF">CLI · HTTP · MCP</text>

    <text x="809" y="166" font-size="21" font-weight="700" fill="#12382D">Your agent</text>
    <text x="809" y="195" font-size="14" fill="#46645A">Search, summarize, archive</text>
    <text x="809" y="219" font-size="13" fill="#46645A">Gets only what it asks for</text>

    <text x="645" y="339" font-size="18" font-weight="700" fill="#12382D">Optional encrypted snapshot</text>
    <text x="645" y="365" font-size="14" fill="#46645A">Restore later without WeChat · 24-word recovery phrase</text>
  </g>

  <g fill="none" stroke="#087F5B" stroke-width="2.5">
    <path d="M290 184h62"/>
    <path d="M599 184h80"/>
    <path d="M478 248v51"/>
  </g>
  <g fill="#087F5B">
    <polygon points="352,184 341,178 341,190"/>
    <polygon points="679,184 668,178 668,190"/>
    <polygon points="478,299 472,288 484,288"/>
  </g>
  <g font-size="13" fill="#46645A">
    <text x="321" y="174" text-anchor="end">reads</text>
    <text x="639" y="174" text-anchor="end">returns</text>
    <text x="496" y="279">optional backup</text>
  </g>
</svg>
