[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greenbubbles-win"
version = "0.2.1"
description = "Read-only access to your local Windows WeChat history, with a CLI, an HTTP connector and an MCP server for agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "seaneer" }, { name = "豆包工作" }]
keywords = ["wechat", "chat-history", "archive", "mcp", "sqlcipher", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Archiving",
]
dependencies = [
  "cryptography>=42",
  "pycryptodome>=3.20",
  "zstandard>=0.22",
  "mnemonic>=0.21",
  "argon2-cffi>=23.1",
]

[project.urls]
"Upstream (macOS)" = "https://github.com/bojieli/greenbubbles"

[project.scripts]
greenbubbles = "greenbubbles_win.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
